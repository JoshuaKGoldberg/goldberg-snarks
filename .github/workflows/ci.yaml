jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - run: pnpm astro sync
      - parallel:
          - name: Astro Check
            run: pnpm check
          - name: Build
            run: pnpm build
          - name: Dedupe Check
            run: pnpm dedupe --check
          - name: Format Check
            run: pnpm format --list-different
          - name: Lint
            run: pnpm lint
          - name: Lint GitHub Actions
            uses: zizmorcore/zizmor-action@v0.8.1
            with:
              advanced-security: "false"
              annotations: "true"
          - name: Lint Knip
            run: pnpm lint:knip
          - name: Lint Spelling
            run: pnpm lint:spelling
          - name: Test
            run: pnpm run test --coverage
          - name: Type Check
            run: pnpm tsc

  engines_check:
    name: Engines Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22.13.0
      - run: pnpm install --prod --engine-strict --ignore-scripts

name: CI

on:
  pull_request: ~
  push:
    branches:
      - main

permissions:
  contents: read
